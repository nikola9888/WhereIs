name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install Cython==0.29.37
          pip install sh

      - name: Check files
        run: |
          ls -la
          test -f buildozer.spec
          test -f requirements.txt || true

      - name: Prepare build
        run: |
          chmod -R 777 .
          rm -rf .buildozer
          rm -rf bin
          rm -rf python-for-android
          mkdir -p bin

      - name: Prepare patched python-for-android
        run: |
          set -e
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git python-for-android
          test -f python-for-android/pythonforandroid/recipes/freetype/__init__.py

          python3 - <<'PY'
          from pathlib import Path

          recipe = Path("python-for-android/pythonforandroid/recipes/freetype/__init__.py")
          text = recipe.read_text()

          old = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
          new = "https://mirror.netcologne.de/savannah/freetype/freetype-{version}.tar.gz"

          if old not in text:
              raise SystemExit("FreeType recipe URL was not found; refusing to patch the wrong file.")

          recipe.write_text(text.replace(old, new, 1))
          print("Patched FreeType recipe URL to:", new)
          PY

          grep -n "url =" python-for-android/pythonforandroid/recipes/freetype/__init__.py

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
        run: |
          set -e
          echo "=== Building with local patched python-for-android ==="
          echo "=== FreeType recipe ==="
          grep -n "url =" python-for-android/pythonforandroid/recipes/freetype/__init__.py
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
