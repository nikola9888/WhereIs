name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install Cython==0.29.37
          pip install sh

      - name: Check files
        run: |
          ls -la
          test -f buildozer.spec
          test -f requirements.txt || true

      - name: Prepare build
        run: |
          chmod -R 777 .

      - name: Prepare FreeType source
        run: |
          set -e
          rm -rf /tmp/freetype-2.14.1 /tmp/freetype.tar.gz
          mkdir -p /tmp/freetype-2.14.1

          python3 - <<'PY'
          import time
          import urllib.request

          urls = [
              "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz",
              "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download",
          ]

          last_error = None
          for url in urls:
              for attempt in range(1, 9):
                  try:
                      print(f"Downloading FreeType from {url} (attempt {attempt}/8)")
                      request = urllib.request.Request(url, headers={"User-Agent": "WhereIs-Build/1.0"})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          with open("/tmp/freetype.tar.gz", "wb") as output:
                              while True:
                                  chunk = response.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  output.write(chunk)
                      print("FreeType download succeeded.")
                      raise SystemExit(0)
                  except Exception as exc:
                      last_error = exc
                      print(f"Download failed: {exc}")
                      time.sleep(min(attempt * 3, 20))

          raise SystemExit(f"Unable to download FreeType: {last_error}")
          PY

          tar -xzf /tmp/freetype.tar.gz --strip-components=1 -C /tmp/freetype-2.14.1
          test -f /tmp/freetype-2.14.1/configure
          echo "FreeType source prepared successfully."

      - name: Patch p4a FreeType recipe to use prepared source
        run: |
          set -e
          P4A_ROOT="$(python3 -c 'import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))')"
          RECIPE="$P4A_ROOT/recipes/freetype/__init__.py"
          echo "P4A root: $P4A_ROOT"
          echo "Recipe: $RECIPE"
          test -f "$RECIPE"
          cp "$RECIPE" "$RECIPE.bak"
          python3 - "$RECIPE" <<'PY'
          import pathlib
          import sys

          recipe = pathlib.Path(sys.argv[1])
          text = recipe.read_text()

          if "P4A_FREETYPE_DIR" in text:
              print("FreeType recipe already patched for local source.")
              raise SystemExit(0)

          patch = '''\n    def download(self):\n        import os\n        import shutil\n        source = os.environ.get("P4A_FREETYPE_DIR")\n        if source and os.path.isdir(source):\n            target = self.get_build_dir(arch=None)\n            if os.path.exists(target):\n                shutil.rmtree(target)\n            shutil.copytree(source, target)\n            self.downloaded = True\n            return\n        return super().download()\n'''

          text += patch
          recipe.write_text(text)
          print("FreeType recipe patched successfully.")
          PY

      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
          P4A_FREETYPE_DIR: /tmp/freetype-2.14.1
        run: |
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
