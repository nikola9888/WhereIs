name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install Cython==0.29.37
          pip install sh

      - name: Check files
        run: |
          ls -la
          test -f buildozer.spec
          test -f requirements.txt || true

      - name: Prepare build
        run: |
          chmod -R 777 .
          rm -rf .buildozer
          rm -rf bin
          rm -rf python-for-android
          mkdir -p bin

      - name: Verify FreeType mirror
        run: |
          set -e
          echo "=== FreeType mirror check ==="
          python3 - <<'PY'
          import urllib.request

          url = "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"
          request = urllib.request.Request(
              url,
              method="HEAD",
              headers={"User-Agent": "WhereIs-Build/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print("FreeType mirror HTTP status:", response.status)
          PY

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
          URL_FREETYPE: "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
        run: |
          set -e
          echo "=== Using FreeType mirror through p4a URL_FREETYPE override ==="
          echo "$URL_FREETYPE"
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
