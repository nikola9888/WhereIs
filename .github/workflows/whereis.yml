name: WhereIs Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            libltdl-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            build-essential \
            gettext \
            rustc \
            cargo

      - name: Install Python build tools
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install \
            "cython==0.29.34" \
            virtualenv \
            "git+https://github.com/kivy/buildozer.git"

      - name: Check build environment
        run: |
          echo "=== PYTHON ==="
          python --version
          which python
          python -m pip --version

          echo "=== BUILDOZER ==="
          buildozer --version

          echo "=== JAVA ==="
          java -version

          echo "=== SPEC ==="
          cat buildozer.spec

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
