name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install Cython==0.29.37
          pip install sh

      - name: Check files
        run: |
          ls -la
          test -f buildozer.spec
          test -f requirements.txt || true

      - name: Prepare build
        run: |
          chmod -R 777 .
          rm -rf .buildozer
          rm -rf bin
          rm -rf python-for-android
          mkdir -p bin

      - name: Prepare local FreeType recipe
        run: |
          set -e
          mkdir -p python-for-android/recipes/freetype

          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          url = "https://raw.githubusercontent.com/kivy/python-for-android/master/pythonforandroid/recipes/freetype/__init__.py"
          target = Path("python-for-android/recipes/freetype/__init__.py")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "WhereIs-Build/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              text = response.read().decode("utf-8")

          # Patch the actual recipe URL generically. The upstream recipe uses
          # a {version} placeholder, so never look for a hard-coded 2.14.1 URL.
          pattern = r"https://download\.savannah\.gnu\.org/releases/freetype/freetype-\{version\}\.tar\.gz"
          replacement = "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
          patched, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              raise SystemExit(
                  "Could not patch the upstream FreeType recipe URL. "
                  "Expected the recipe to contain the {version} Savannah URL."
              )

          target.write_text(patched, encoding="utf-8")
          print("FreeType local recipe created successfully.")
          PY

          test -f python-for-android/recipes/freetype/__init__.py
          grep -n "url =\|savannah" python-for-android/recipes/freetype/__init__.py

          echo "=== Verify buildozer.spec local recipe setting ==="
          grep -n "p4a.local_recipes" buildozer.spec
          awk '
            /^\[app\]/{in_app=1}
            /^\[buildozer\]/{in_app=0}
            in_app && /p4a.local_recipes/{found=1}
            END {
              if (!found) {
                print "ERROR: p4a.local_recipes is not inside [app]"
                exit 1
              }
              print "OK: p4a.local_recipes is inside [app]"
            }
          ' buildozer.spec

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
        run: |
          set -e
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
