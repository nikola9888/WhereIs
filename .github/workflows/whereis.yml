name: WhereIs APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -la

          echo "=== BUILDOZER ==="
          buildozer --version

          echo "=== PYTHON ==="
          python3 --version
          python3 -c "import sys; print(sys.executable)"

          echo "=== BUILD SPEC ==="
          cat buildozer.spec

          echo "=== SOURCE ==="
          find . -maxdepth 2 -type f | sort

      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== BIN ==="
          ls -lah bin/

          echo "=== APK FILES ==="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
