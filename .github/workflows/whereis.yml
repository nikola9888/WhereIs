name: WhereIs Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current Buildozer toolchain
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir \
            git+https://github.com/kivy/buildozer.git \
            legacy-cgi \
            setuptools \
            cython==0.29.34

      - name: Check project files
        run: |
          set -e
          ls -la
          test -f buildozer.spec
          test -f main.py

      - name: Prepare clean build
        run: |
          set -e
          chmod -R 777 .
          rm -rf .buildozer
          rm -rf bin
          rm -rf python-for-android
          mkdir -p bin

      - name: Prepare patched python-for-android develop
        run: |
          set -e
          git clone --depth 1 --branch develop https://github.com/kivy/python-for-android.git python-for-android
          test -f python-for-android/pythonforandroid/recipes/freetype/__init__.py

          python3 - <<'PY'
          from pathlib import Path

          recipe = Path("python-for-android/pythonforandroid/recipes/freetype/__init__.py")
          text = recipe.read_text()

          old = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
          new = "https://mirror.netcologne.de/savannah/freetype/freetype-{version}.tar.gz"

          if old in text:
              recipe.write_text(text.replace(old, new, 1))
              print("Patched FreeType recipe URL to:", new)
          else:
              print("FreeType URL already changed or recipe format has changed; continuing.")
          PY

          grep -n "url =" python-for-android/pythonforandroid/recipes/freetype/__init__.py || true

      - name: Build release APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
        run: |
          set -e
          echo "=== Build configuration ==="
          grep -E '^(android\.api|android\.minapi|android\.ndk|android\.release_artifact|p4a\.branch|p4a\.python_version)' buildozer.spec
          echo "=== Building Android release APK ==="
          yes | buildozer -v android release

      - name: Sign release APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
        run: |
          set -e

          echo "=== Finding unsigned release APK ==="
          APK_FILE="$(find bin -maxdepth 1 -type f -name '*-release-unsigned.apk' -print -quit)"
          test -n "$APK_FILE"
          echo "Unsigned APK: $APK_FILE"

          echo "=== Locating Android SDK / apksigner ==="
          APKSIGNER=""

          # Buildozer normally installs the SDK inside the project directory.
          for candidate in \
            "$PWD/.buildozer/android/platform/android-sdk/build-tools" \
            "$GITHUB_WORKSPACE/.buildozer/android/platform/android-sdk/build-tools" \
            "/root/.buildozer/android/platform/android-sdk/build-tools" \
            "/home/.buildozer/android/platform/android-sdk/build-tools"; do
            if [ -d "$candidate" ]; then
              APKSIGNER="$(find "$candidate" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1 || true)"
              if [ -n "$APKSIGNER" ]; then
                break
              fi
            fi
          done

          # Final fallback: search the whole container. This avoids assuming
          # a fixed SDK location inside the Kivy Buildozer container.
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find / -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found anywhere in the container"
            echo "=== Possible Android SDK directories ==="
            find / -type d -name build-tools -print 2>/dev/null | head -100 || true
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          chmod +x "$APKSIGNER"

          KEYSTORE="$RUNNER_TEMP/whereis-release.keystore"
          KEY_ALIAS="whereis"
          STORE_PASSWORD="whereis-release-store"

          echo "=== Generating temporary release keystore ==="
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WhereIs, OU=WhereIs, O=Develop4World, L=Pancevo, ST=Serbia, C=RS"

          SIGNED_APK="${APK_FILE%-unsigned.apk}.apk"

          echo "=== Signing APK ==="
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --out "$SIGNED_APK" \
            "$APK_FILE"

          echo "=== Verifying APK signature ==="
          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          echo "=== Final signed APK ==="
          rm -f "$APK_FILE"
          mv "$SIGNED_APK" "bin/whereis-1.0.0-arm64-v8a-release.apk"
          ls -lah bin/*.apk

      - name: Check APK
        run: |
          set -e
          echo "=== APK FILES ==="
          ls -lah bin/
          APK_FILE="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          echo "=== APK SHA256 ==="
          sha256sum "$APK_FILE"
          echo "=== APK SIZE ==="
          du -h "$APK_FILE"

      - name: Upload WhereIs release APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-release-apk
          path: bin/*.apk
          if-no-files-found: error
