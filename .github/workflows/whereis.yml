name: WhereIs APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: python:3.14-bookworm

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt-get update

        apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          libpng-dev \
          libfreetype6-dev \
          build-essential \
          ccache

    - name: Check Python
      run: |
        echo "=== PYTHON ==="
        python3 --version
        which python3

        echo "=== PIP ==="
        python3 -m pip --version

    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install \
          "buildozer" \
          "cython<3.0" \
          setuptools

    - name: Check Buildozer
      run: |
        buildozer --version

    - name: Check project
      run: |
        echo "=== PROJECT FILES ==="
        find . -maxdepth 2 -type f | sort

        echo "=== BUILDOZER SPEC ==="
        cat buildozer.spec

    - name: Clean old build
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Build APK
      run: |
        yes | buildozer android debug

    - name: Check APK
      run: |
        echo "=== APK FILES ==="
        ls -lh bin/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhereIs-release-apk
        path: bin/*.apk
