name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install Cython==0.29.37
          pip install sh

      - name: Check files
        run: |
          ls -la
          test -f buildozer.spec
          test -f requirements.txt || true

      - name: Prepare build
        run: |
          chmod -R 777 .
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Initialize Buildozer
        run: |
          buildozer android update

      - name: Patch p4a FreeType recipe
        run: |
          set -e
          RECIPE=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py"
          test -f "$RECIPE"
          echo "=== FreeType recipe before patch ==="
          grep -n "freetype-2.14.1\|savannah" "$RECIPE" || true

          python3 - "$RECIPE" <<'PY'
          from pathlib import Path
          import sys

          recipe = Path(sys.argv[1])
          text = recipe.read_text()

          old = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"
          new = "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"

          if old in text:
              text = text.replace(old, new)
              recipe.write_text(text)
              print("FreeType URL patched to download-mirror.savannah.gnu.org")
          elif new in text:
              print("FreeType URL is already patched.")
          else:
              raise SystemExit("Expected FreeType 2.14.1 URL was not found in the p4a recipe.")
          PY

          echo "=== FreeType recipe after patch ==="
          grep -n "freetype-2.14.1\|savannah" "$RECIPE" || true

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
        run: |
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
