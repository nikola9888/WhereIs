name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install Cython==0.29.37
          pip install sh

      - name: Check files
        run: |
          ls -la
          test -f buildozer.spec
          test -f requirements.txt || true

      - name: Prepare build
        run: |
          chmod -R 777 .
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Prepare local FreeType recipe
        run: |
          set -e
          mkdir -p python-for-android/recipes/freetype

          python3 - <<'PY'
          from pathlib import Path
          import urllib.request

          url = "https://raw.githubusercontent.com/kivy/python-for-android/master/pythonforandroid/recipes/freetype/__init__.py"
          target = Path("python-for-android/recipes/freetype/__init__.py")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "WhereIs-Build/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              text = response.read().decode("utf-8")

          old = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
          new = "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"

          if old not in text:
              raise SystemExit("Could not find the expected FreeType URL in the upstream recipe.")

          text = text.replace(old, new)
          target.write_text(text, encoding="utf-8")
          print("Local FreeType recipe prepared with download-mirror.savannah.gnu.org")
          PY

          python3 - <<'PY'
          from pathlib import Path

          spec = Path("buildozer.spec")
          text = spec.read_text(encoding="utf-8")
          setting = "p4a.local_recipes = %(source.dir)s/python-for-android/recipes/"

          if "p4a.local_recipes" not in text:
              marker = "\n[buildozer]"
              if marker not in text:
                  raise SystemExit("[buildozer] section was not found in buildozer.spec")
              text = text.replace(marker, "\n" + setting + marker, 1)
              spec.write_text(text, encoding="utf-8")
              print("Added p4a.local_recipes to buildozer.spec")
          else:
              print("p4a.local_recipes is already configured.")
          PY

          echo "=== Local FreeType recipe ==="
          grep -n "version\|url =\|savannah" python-for-android/recipes/freetype/__init__.py
          echo "=== p4a.local_recipes ==="
          grep -n "p4a.local_recipes" buildozer.spec

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          SETUPTOOLS_USE_DISTUTILS: "local"
        run: |
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== APK FILES ==="
          ls -lah bin/
          echo "=== APK SHA256 ==="
          sha256sum bin/*.apk

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
