name: WhereIs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"
      # Avoid the intermittent Savannah 502 for the FreeType recipe.
      # python-for-android uses this directory instead of downloading its
      # normal FreeType archive when P4A_FREETYPE_DIR is set.
      P4A_FREETYPE_DIR: /tmp/freetype-2.14.1

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install sh

    - name: Check files
      run: |
        ls -la
        test -f buildozer.spec
        test -f requirements.txt || true

    - name: Prepare build
      run: |
        chmod -R 777 .

    - name: Prepare FreeType source
      run: |
        set -e
        rm -rf /tmp/freetype-2.14.1
        mkdir -p /tmp/freetype-2.14.1

        download_freetype() {
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 \
            -o /tmp/freetype.tar.gz "$1"
        }

        if ! download_freetype \
          "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"; then
          echo "Savannah mirror failed, trying SourceForge..."
          download_freetype \
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download"
        fi

        tar -xzf /tmp/freetype.tar.gz \
          --strip-components=1 \
          -C /tmp/freetype-2.14.1

        test -f /tmp/freetype-2.14.1/configure
        echo "FreeType source prepared successfully."

    - name: Clean build
      run: |
        rm -rf .buildozer
        rm -rf bin
        mkdir -p bin

    - name: Build WhereIs APK
      env:
        ACCEPT_ANDROID_SDK_LICENSE: "yes"
        PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        SETUPTOOLS_USE_DISTUTILS: "local"
        P4A_FREETYPE_DIR: /tmp/freetype-2.14.1
      run: |
        yes | buildozer android debug

    - name: Check APK
      run: |
        echo "=== APK FILES ==="
        ls -lah bin/
        echo "=== APK SHA256 ==="
        sha256sum bin/*.apk

    - name: Upload WhereIs APK
      uses: actions/upload-artifact@v4
      with:
        name: WhereIs-debug-apk
        path: bin/*.apk
        if-no-files-found: error
