name: WhereIs APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Check environment
        run: |
          echo "=== PYTHON ==="
          python --version
          python3 --version

          echo "=== PIP ==="
          python -m pip --version

          echo "=== JAVA ==="
          java -version

          echo "=== ANDROID ==="
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Check project
        run: |
          echo "=== PROJECT FILES ==="
          ls -la

          echo "=== BUILDOZER SPEC ==="
          cat buildozer.spec

      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Check APK
        run: |
          echo "=== BIN ==="
          ls -lah bin/

          echo "=== APK ==="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
