name: WhereIs Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install sh

    - name: Check files
      run: |
        ls -la
        test -f buildozer.spec
        test -f requirements.txt || true

    - name: Prepare build
      run: |
        chmod -R 777 .

    - name: Clean build
      run: |
        rm -rf .buildozer
        rm -rf bin
        mkdir -p bin

    - name: Build WhereIs APK
      env:
        ACCEPT_ANDROID_SDK_LICENSE: "yes"
        PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        SETUPTOOLS_USE_DISTUTILS: "local"
      run: |
        yes | buildozer android debug

    - name: Check APK
      run: |
        echo "=== APK FILES ==="
        ls -lah bin/
        echo "=== APK SHA256 ==="
        sha256sum bin/*.apk

    - name: Upload WhereIs APK
      uses: actions/upload-artifact@v4
      with:
        name: WhereIs-debug-apk
        path: bin/*.apk
        if-no-files-found: error
