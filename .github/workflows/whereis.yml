name: WhereIs APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          automake \
          autopoint \
          gettext \
          build-essential

    - name: Check environment
      run: |
        echo "=== PYTHON ==="
        python --version
        which python

        echo "=== PIP ==="
        python -m pip --version

        echo "=== JAVA ==="
        java -version

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel

        python -m pip install \
          "buildozer" \
          "cython<3"

    - name: Check Buildozer
      run: |
        buildozer --version

    - name: Check project
      run: |
        echo "=== FILES ==="
        ls -la

        echo "=== BUILDOZER SPEC ==="
        cat buildozer.spec

        echo "=== REQUIREMENTS FILES ==="
        find . -maxdepth 3 -type f \( \
          -name "requirements.txt" -o \
          -name "pyproject.toml" -o \
          -name "setup.py" \
        \) -print

    - name: Clean build
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Build APK
      run: |
        yes | buildozer android debug

    - name: Check APK
      run: |
        echo "=== APK ==="
        ls -lh bin/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhereIs-release-apk
        path: bin/*.apk
