name: WhereIs APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install tools
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install sh


    - name: Check files
      run: |
        ls -la
        echo "Checking buildozer.spec..."
        ls -la buildozer.spec


    - name: Prepare build
      run: |
        chmod -R 777 .


    - name: Clean build
      run: |
        rm -rf .buildozer
        rm -rf bin


    - name: Build APK
      run: |
        yes | buildozer android debug


    - name: Check APK
      run: |
        ls -lh bin/


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhereIs-release-apk
        path: bin/*.apk
