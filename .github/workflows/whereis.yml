name: WhereIs APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python 3.11
      # --------------------------------------------------

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"


      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ccache

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      # --------------------------------------------------
      # Python packages
      # --------------------------------------------------

      - name: Install Python build tools
        run: |
          python --version
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            cython==0.29.37 \
            virtualenv

      # --------------------------------------------------
      # Verify Buildozer
      # --------------------------------------------------

      - name: Check Build environment
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python --version
          which python

          echo "======================================"
          echo "PIP"
          echo "======================================"

          pip --version

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"

          buildozer --version

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

      # --------------------------------------------------
      # Check project
      # --------------------------------------------------

      - name: Check project files
        run: |
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

          echo "======================================"
          echo "BUILDOZER SPEC"
          echo "======================================"

          cat buildozer.spec

      # --------------------------------------------------
      # Clean everything
      # --------------------------------------------------

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build WhereIs APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          yes | buildozer android debug

      # --------------------------------------------------
      # Check result
      # --------------------------------------------------

      - name: Check APK
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          ls -lah bin/

          echo "======================================"
          echo "APK SHA256"
          echo "======================================"

          sha256sum bin/*.apk

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload WhereIs APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIs-release-apk
          path: bin/*.apk
          if-no-files-found: error
